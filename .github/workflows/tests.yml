name: Python and web tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    env:
      PYTHONNOUSERSITE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Python and frontend-test support (no GTK or display server)
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-venv nodejs node-jsdom
      - name: Verify JavaScript DOM test tooling
        run: node -e "require('jsdom'); console.log('jsdom ready')"
      - name: Install web application and test dependencies
        run: bash install.sh --dev
      - name: Check web dependencies and included CSV
        run: bash run.sh --doctor
      - name: Run unit and web API tests
        run: .venv/bin/python -m pytest tests -q
