[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "football-predictor-gtk"
version = "0.1.0"
description = "Aplicație desktop GTK4 pentru analiza și predicția meciurilor de fotbal"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pandas>=2.2", "scipy>=1.12", "scikit-learn>=1.4"]

[project.optional-dependencies]
dev = ["pytest>=8"]
gtk = ["PyGObject>=3.48"]
scraping = ["soccerdata"]

[project.scripts]
football-predictor = "football_predictor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"football_predictor.ui" = ["style.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
